<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sitemap completo · Plataforma HUB</title>
  <script>
    (() => {
      let theme;
      try { theme = localStorage.getItem('hub-sitemap-theme'); } catch {}
      document.documentElement.dataset.theme = theme === 'dark' || theme === 'light'
        ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
  </script>
  <style>
    :root {
      --bg:#eef1f5; --ink:#18222d; --muted:#64727f; --line:#d6dde5;
      --panel:rgba(255,255,255,.92); --shadow:0 18px 42px rgba(28,43,58,.12);
      --accent:#2e6b9f; --radius:12px;
      --c-global:#2e6b9f; --c-mvp:#287a65; --c-prop:#b0721a; --c-fut:#6b7280;
    }
    :root { color-scheme:light; }
    :root[data-theme="dark"] {
      color-scheme:dark;
      --bg:#0f1721; --ink:#e5edf5; --muted:#a8b8c9;
      --line:#3a4b5e; --panel:rgba(22,33,45,.94);
      --shadow:0 18px 42px rgba(0,0,0,.35);
    }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
    button, input, select { font:inherit; }
    .app { height:100%; display:grid; grid-template-rows:auto 1fr; }

    header { z-index:5; display:flex; align-items:center; gap:20px; padding:12px 20px; background:var(--panel); backdrop-filter:blur(18px); border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:11px; min-width:230px; }
    .brand-mark { width:32px; height:32px; display:grid; place-items:center; border-radius:10px; color:#fff; background:linear-gradient(145deg,#2e6b9f,#287a65); font-size:15px; font-weight:800; }
    .brand h1 { margin:0; font-size:16px; letter-spacing:-.02em; }
    .brand p { margin:2px 0 0; font-size:11px; color:var(--muted); }
    .toolbar { display:flex; align-items:center; gap:8px; flex:1; flex-wrap:wrap; }
    .search-wrap { position:relative; display:flex; align-items:center; }
    .search-wrap svg { position:absolute; left:11px; width:15px; height:15px; stroke:var(--muted); fill:none; stroke-width:2; pointer-events:none; }
    .search { width:min(300px,32vw); padding:9px 30px 9px 32px; border:1px solid var(--line); border-radius:10px; outline:none; background:#fbfcfd; color:var(--ink); }
    [data-theme="dark"] .search { background:#202f40; }
    .search:focus { border-color:#6d9bc1; box-shadow:0 0 0 4px rgba(46,107,159,.14); }
    .search-clear { position:absolute; right:6px; border:0; background:transparent; color:var(--muted); padding:4px 7px; border-radius:7px; display:none; }
    .search-clear.on { display:block; }
    .count { font-size:11px; color:var(--muted); min-width:72px; font-variant-numeric:tabular-nums; }
    button, select { border:1px solid var(--line); border-radius:9px; padding:8px 11px; color:var(--ink); background:#fff; cursor:pointer; }
    [data-theme="dark"] button, [data-theme="dark"] select { background:#202f40; }
    button:hover, select:hover { border-color:#9eabb9; transform:translateY(-1px); }
    button:active { transform:translateY(0); }
    button:focus-visible, select:focus-visible, .search:focus-visible { outline:3px solid #80b8e5; outline-offset:2px; }
    .seg { display:flex; gap:0; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
    .seg button { border:0; border-radius:0; padding:8px 10px; }
    .seg button + button { border-left:1px solid var(--line); }
    .zoom-readout { min-width:52px; text-align:center; font-variant-numeric:tabular-nums; font-size:12px; color:var(--muted); }
    #theme-toggle { display:inline-flex; align-items:center; gap:7px; white-space:nowrap; margin-left:auto; }
    #theme-toggle svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.7; }

    .workspace { position:relative; overflow:hidden; background-color:#f4f6f9; background-image:radial-gradient(#c9d3de .8px, transparent .8px); background-size:26px 26px; }
    [data-theme="dark"] .workspace { background-color:#101923; background-image:radial-gradient(#34465a .8px, transparent .8px); }
    #canvas { width:100%; height:100%; display:block; cursor:grab; user-select:none; touch-action:none; }
    #canvas.dragging { cursor:grabbing; }

    .edge { fill:none; stroke:#aeb9c4; stroke-width:1.4; opacity:.5; transition:opacity .18s, stroke .18s; }
    .edge.future { stroke-dasharray:6 5; }
    .edge.lit { stroke:var(--accent); stroke-width:2; opacity:1; }
    .edge.dim, .node.dim { opacity:.14; }
    .edge.hidden, .node.hidden { opacity:0; pointer-events:none; }
    .node.dim { filter:saturate(.4); }

    .group { fill:rgba(255,255,255,.5); stroke:var(--line); stroke-width:1.2; stroke-dasharray:8 6; }
    [data-theme="dark"] .group { fill:rgba(33,49,66,.32); stroke:#465c73; }
    .group-title { font-size:12.5px; font-weight:800; letter-spacing:.02em; fill:#5d6b7a; }
    [data-theme="dark"] .group-title { fill:#b7c8db; }
    .group-count { font-size:10.5px; font-weight:700; fill:#8a97a5; }
    [data-theme="dark"] .group-count { fill:#8fa3b8; }

    .node { cursor:pointer; outline:none; }
    .node rect.body { stroke-width:1.3; filter:drop-shadow(0 6px 10px rgba(35,48,64,.10)); transition:filter .18s; }
    .node:hover rect.body, .node:focus-visible rect.body { filter:drop-shadow(0 12px 18px rgba(35,48,64,.18)); }
    .node:focus-visible rect.body { stroke:#80b8e5; stroke-width:2.4; }
    .node text { pointer-events:none; fill:currentColor; }
    .node .title { font-size:12.5px; font-weight:700; }
    .node .meta { font-size:10px; opacity:.7; }
    .node .bid { font-size:9px; font-weight:800; letter-spacing:.06em; opacity:.55; }
    .node rect.bar { stroke:none; }
    .node.global rect.bar { fill:var(--c-global); } .node.mvp rect.bar { fill:var(--c-mvp); }
    .node.proposed rect.bar { fill:var(--c-prop); } .node.future rect.bar { fill:var(--c-fut); }
    .node.root rect.bar { fill:var(--ink); }
    .node.global rect.body { fill:#edf5fb; stroke:#75a2c4; } .node.global { color:#214e73; }
    .node.mvp rect.body { fill:#e9f5f0; stroke:#64a38e; } .node.mvp { color:#1e604e; }
    .node.proposed rect.body { fill:#fdf3e3; stroke:#d1a365; } .node.proposed { color:#7d511a; }
    .node.future rect.body { fill:#eff0f2; stroke:#a9b0b9; } .node.future { color:#59616b; }
    .node.root rect.body { fill:var(--panel); stroke:var(--ink); stroke-width:1.4; } .node.root { color:var(--ink); }
    [data-theme="dark"] .node.global { color:#c9e6ff; } [data-theme="dark"] .node.global rect.body { fill:#203d55; stroke:#75a2c4; }
    [data-theme="dark"] .node.mvp { color:#c2ecdb; } [data-theme="dark"] .node.mvp rect.body { fill:#1b4038; stroke:#64a38e; }
    [data-theme="dark"] .node.proposed { color:#ffe1af; } [data-theme="dark"] .node.proposed rect.body { fill:#49381f; stroke:#d1a365; }
    [data-theme="dark"] .node.future { color:#d8e0e9; } [data-theme="dark"] .node.future rect.body { fill:#303b49; stroke:#a9b0b9; }
    .node.selected rect.body { stroke:#172b3d; stroke-width:2.4; }
    [data-theme="dark"] .node.selected rect.body { stroke:#fff; }
    .node.match rect.body { stroke:var(--accent); stroke-width:2.4; filter:drop-shadow(0 8px 14px rgba(46,107,159,.25)); }

    .hud { position:absolute; left:16px; bottom:14px; display:flex; gap:10px; align-items:center; padding:9px 12px; background:var(--panel); border:1px solid var(--line); border-radius:11px; box-shadow:var(--shadow); font-size:11px; color:var(--muted); backdrop-filter:blur(12px); flex-wrap:wrap; max-width:calc(100% - 32px); }
    .hud button { border:0; background:transparent; padding:3px 6px; color:var(--muted); display:inline-flex; align-items:center; }
    .hud button[aria-pressed="true"] { color:var(--ink); background:rgba(127,140,155,.16); border-radius:7px; }
    .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; }
    .dot.global{background:#75a2c4}.dot.mvp{background:#64a38e}.dot.proposed{background:#d1a365}.dot.future{background:#a9b0b9}
    .help { position:absolute; right:16px; bottom:14px; padding:9px 12px; background:var(--panel); border:1px solid var(--line); border-radius:11px; color:var(--muted); font-size:11px; }
    .inspector { position:absolute; right:16px; top:16px; width:300px; max-height:calc(100% - 200px); overflow:auto; padding:16px; background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
    .inspector h2 { margin:0 0 8px; font-size:16px; line-height:1.25; letter-spacing:-.015em; }
    .inspector p { margin:7px 0; color:var(--muted); font-size:12px; line-height:1.55; }
    .inspector strong { color:var(--ink); }
    .inspector .row { display:flex; gap:8px; margin-top:10px; }
    .inspector .row button { flex:1; }
    .tag { display:inline-block; margin:0 4px 6px 0; padding:4px 9px; border-radius:999px; background:#edf0f3; color:#536170; font-size:10px; font-weight:800; letter-spacing:.02em; }
    [data-theme="dark"] .tag { background:#2b4055; color:#d4e3f2; }
    .chip { display:inline-block; margin:2px 4px 2px 0; padding:3px 8px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink); font-size:11px; }
    .chip:hover { border-color:var(--accent); }
    .empty { color:var(--muted); font-size:13px; line-height:1.55; }
    .kbd { font-size:10px; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 5px; background:rgba(127,140,155,.12); }
    #mini { position:absolute; right:16px; bottom:58px; width:196px; height:124px; padding:6px; background:var(--panel); border:1px solid var(--line); border-radius:11px; box-shadow:var(--shadow); }
    #minimap { width:100%; height:100%; display:block; }
    #minimap rect { fill:#dfe5eb; stroke:#c4ccd5; }
    [data-theme="dark"] #minimap rect { fill:#40566e; stroke:#9ab0c6; }
    #mini-view { fill:rgba(46,107,159,.12) !important; stroke:var(--accent) !important; stroke-width:2; }
    @media (max-width:900px) {
      header{gap:10px;padding:10px 12px;align-items:flex-start;flex-wrap:wrap}
      .brand{min-width:0} .search{width:100%} .search-wrap{flex:1;min-width:180px}
      #theme-toggle{margin-left:0} .help{display:none}
      .inspector{right:10px;top:10px;width:min(270px,calc(100vw - 20px))}
      #mini{display:none} .hud{left:10px;bottom:10px}
    }
    @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="brand-mark">H</div><div><h1>Sitemap completo</h1><p>Plataforma HUB · canvas navegável</p></div></div>
    <div class="toolbar">
      <span class="search-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" class="search" type="search" placeholder="Buscar tela, ID ou rota…" aria-label="Buscar tela" autocomplete="off">
        <button id="clear" class="search-clear" type="button" aria-label="Limpar busca">✕</button>
      </span>
      <span id="count" class="count" aria-live="polite"></span>
      <select id="filter" aria-label="Filtrar camada"><option value="all">Todas as camadas</option><option value="global">Global</option><option value="mvp">MVP</option><option value="proposed">Proposta</option><option value="future">MVP+1</option></select>
      <span class="seg" role="group" aria-label="Zoom">
        <button id="zout" type="button" aria-label="Reduzir zoom">−</button>
        <button id="zin" type="button" aria-label="Aumentar zoom">+</button>
      </span>
      <button id="fit" type="button">Ajustar à tela</button>
      <button id="reset" type="button">Reiniciar</button>
      <span id="zoom" class="zoom-readout">100%</span>
      <button id="theme-toggle" type="button" aria-label="Alternar tema" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg>
        <span id="theme-label">Modo escuro</span>
      </button>
    </div>
  </header>
  <main class="workspace" id="workspace">
    <svg id="canvas" role="img" aria-label="Sitemap completo da plataforma HUB">
      <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#aeb8c3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
      <g id="world"></g>
    </svg>
    <aside class="inspector" id="inspector" aria-live="polite"><div class="empty">Selecione uma tela para ver ID, rota, escopo e conexões.<br><br><span class="kbd">clique</span> seleciona · <span class="kbd">clique duplo</span> aproxima · <span class="kbd">esc</span> limpa</div></aside>
    <div id="mini"><svg id="minimap" viewBox="0 0 1800 1660" aria-hidden="true"></svg></div>
    <div class="hud" role="group" aria-label="Legenda e filtro rápido">
      <button type="button" data-layer="global" aria-pressed="false"><i class="dot global"></i>Global</button>
      <button type="button" data-layer="mvp" aria-pressed="false"><i class="dot mvp"></i>MVP</button>
      <button type="button" data-layer="proposed" aria-pressed="false"><i class="dot proposed"></i>Proposta</button>
      <button type="button" data-layer="future" aria-pressed="false"><i class="dot future"></i>MVP+1</button>
    </div>
    <div class="help">Arraste para mover · roda / <span class="kbd">+</span><span class="kbd">−</span> zoom · clique numa tela</div>
  </main>
</div>
<script>
  const themeToggle = document.getElementById('theme-toggle');
  function updateThemeToggle() {
    const dark = document.documentElement.dataset.theme === 'dark';
    themeToggle.setAttribute('aria-pressed', String(dark));
    document.getElementById('theme-label').textContent = dark ? 'Modo claro' : 'Modo escuro';
  }
  themeToggle.addEventListener('click', () => {
    const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('hub-sitemap-theme', theme); } catch {}
    updateThemeToggle();
  });
  updateThemeToggle();

  const VB_W = 1800, VB_H = 1660;
  const nodes = [
    ['hub','Plataforma HUB','root',''],
    ['auth','Autenticação','group',''],['a1','Login / SSO','global',''],['a2','MFA','global',''],['a3','Seleção de organização / tenant','global',''],['a4','Acesso negado / sessão expirada','global',''],
    ['shell','Shell global','group',''],['b1','Navegação principal','global',''],['b2','Seletor de organização','global',''],['b3','Seletor de período e escopo','global',''],['b4','Busca global','global','/busca'],['b5','Notificações','global','/notificacoes'],['b6','Ajuda / explicabilidade','global','/ajuda'],['b7','Perfil do usuário','global',''],['b8','Breadcrumbs de auditoria','global',''],
    ['mvp','Telas oficiais do MVP','group',''],['c1','SCR-01 · Cockpit executivo','mvp','WF-01 · /cockpit'],['c2','SCR-02 · Painel do gestor','mvp','WF-02 · /gestao'],['c3','SCR-03 · Minha jornada','mvp','WF-06 · /minha-jornada'],['c4','SCR-04 · Governança de KPIs','mvp','WF-04'],['c5','SCR-05 · Alertas e decisões','mvp','WF-03 · /alertas'],['c6','SCR-06 · ROI do HUB','mvp','WF-05 · /roi'],['c7','SCR-07 · Diagnóstico de dados','mvp','WF-07 · /dados'],
    ['details','Detalhe e ação · propostas','group',''],['d1','Detalhe de KPI','proposed',''],['d2','Análise de drivers','proposed',''],['d3','Simulador de cenário','proposed',''],['d4','Detalhe de cliente','proposed',''],['d5','Evidência de ROI','proposed',''],['d6','Detalhe da equipe','proposed',''],['d7','Detalhe da pessoa','proposed',''],['d8','Detalhe da meta','proposed',''],['d9','Detalhe de capacidade','proposed',''],['d10','Detalhe do alerta','proposed',''],['d11','Editor de plano de ação','proposed',''],['d12','Editor de check-in','proposed',''],['d13','Detalhe de feedback','proposed',''],['d14','Perfil de skills','proposed',''],['d15','Plano de desenvolvimento','proposed',''],['d16','Formulário de contestação','proposed',''],['d17','Criar KPI / editar rascunho','proposed',''],['d18','Enviar para aprovação','proposed',''],['d19','Aprovar / rejeitar','proposed',''],['d20','Comparar versões','proposed',''],['d21','Visualizar lineage','proposed',''],['d22','Explicar alerta','proposed',''],['d23','Atribuir responsável','proposed',''],['d24','Registrar decisão','proposed',''],['d25','Criar ação / escalar / encerrar','proposed',''],['d26','Trilha de auditoria','proposed',''],['d27','Detalhe do benefício','proposed',''],['d28','Anexar evidência','proposed',''],['d29','Validar valor financeiro','proposed',''],['d30','Ajustar premissa','proposed',''],['d31','Comparar estimado e realizado','proposed',''],['d32','Detalhe da fonte','proposed',''],['d33','Detalhe da execução do job','proposed',''],['d34','Detalhe de rejeições','proposed',''],['d35','Confirmar reprocessamento','proposed',''],['d36','Relatório de qualidade','proposed',''],
    ['functional','Telas funcionais globais','group',''],['e1','Administração de usuários','global','/admin/usuarios'],['e2','Administração de tenants','global','/admin/tenants'],['e3','Visor de auditoria','global','/admin/auditoria'],['e4','Consentimento e privacidade','global','/privacidade/finalidades'],['e5','Detalhe de notificação','global','/alertas/:id'],['e6','Ajuda por tópico','global','/ajuda/:topico'],
    ['future','MVP+1 · contrato/rotas','group',''],['f1','SCR-08 · Marketplace de fornecedores','future',''],['f2','SCR-09 · API de indicadores','future','']
  ].map(([id,label,kind,meta])=>({id,label,kind,meta}));
  const edges = [
    ['hub','auth'],['hub','shell'],['hub','mvp'],['hub','functional'],['hub','future','future'],['a1','a2'],['a2','a3'],['a3','a4','future'],
    ['shell','b1'],['shell','b2'],['shell','b3'],['shell','b4'],['shell','b5'],['shell','b6'],['shell','b7'],['shell','b8'],
    ['mvp','c1'],['mvp','c2'],['mvp','c3'],['mvp','c4'],['mvp','c5'],['mvp','c6'],['mvp','c7'],['functional','e1'],['functional','e2'],['functional','e3'],['functional','e4'],['functional','e5'],['functional','e6'],['future','f1','future'],['future','f2','future'],
    ['c1','d1'],['d1','d2'],['d2','d3'],['c1','d4'],['c1','d5'],['c2','d6'],['c2','d7'],['d7','d8'],['c2','d9'],['c2','d10'],['d10','d11'],['c3','d8'],['c3','d12'],['d12','d13'],['c3','d14'],['d14','d15'],['c3','d16'],['c4','d17'],['d17','d18'],['d18','d19'],['c4','d20'],['c4','d21'],['c5','d10'],['c5','d22'],['d22','d23'],['d23','d24'],['d24','d25'],['c5','d26'],['c6','d27'],['d27','d28'],['d28','d29'],['c6','d30'],['c6','d31'],['c7','d32'],['c7','d33'],['d33','d34'],['d34','d35'],['c7','d36'],['b5','e5'],['b6','e6'],['c1','c5','future'],['c2','c5','future'],['c5','c6','future'],['c4','c7','future']
  ].map(([from,to,type])=>({from,to,type:type||'normal'}));

  const W = 248, H = 60;
  const P = 70, TOP = 214;
  const colX = { auth:128, shell:452, mvp:776, functional:1100, future:1424 };
  const pos = { hub:[776,30] };
  ['a1','a2','a3','a4'].forEach((id,i)=>pos[id]=[colX.auth, TOP+i*P]);
  ['b1','b2','b3','b4','b5','b6','b7','b8'].forEach((id,i)=>pos[id]=[colX.shell, TOP+i*P]);
  ['c1','c2','c3','c4','c5','c6','c7'].forEach((id,i)=>pos[id]=[colX.mvp, TOP+i*P]);
  ['e1','e2','e3','e4','e5','e6'].forEach((id,i)=>pos[id]=[colX.functional, TOP+i*P]);
  ['f1','f2'].forEach((id,i)=>pos[id]=[colX.future, TOP+i*P]);
  const detailIds = nodes.filter(n=>/^d\d+$/.test(n.id)).map(n=>n.id);
  detailIds.forEach((id,i)=>{ const c=i%6, r=Math.floor(i/6); pos[id]=[104+c*264, 992+r*94]; });

  const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
  const world = document.getElementById('world'), canvas=document.getElementById('canvas'),
        workspace=document.getElementById('workspace'), searchEl=document.getElementById('search'),
        filterEl=document.getElementById('filter'), countEl=document.getElementById('count'),
        clearBtn=document.getElementById('clear');
  canvas.setAttribute('viewBox', `0 0 ${VB_W} ${VB_H}`);

  const groupBoxes = {
    auth:[104,140,296,368], shell:[428,140,296,648], mvp:[752,140,296,578],
    functional:[1076,140,296,508], future:[1400,140,296,220], details:[104,942,1592,672]
  };
  const groupCount = {};
  nodes.forEach(n=>{ if(n.kind==='group'||n.id==='hub')return; });
  function boxCount(id){
    if(id==='auth')return 4; if(id==='shell')return 8; if(id==='mvp')return 7;
    if(id==='functional')return 6; if(id==='future')return 2; if(id==='details')return 36; return 0;
  }

  function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
  function wrap(label){const words=label.split(' '), lines=[];let line='';words.forEach(w=>{if((line+' '+w).trim().length>26&&line){lines.push(line);line=w;}else line=(line+' '+w).trim();});if(line)lines.push(line);return lines.slice(0,2);}

  function card(n){
    const [x,y]=pos[n.id], w=n.id==='hub'?248:W, lines=wrap(n.label),
      h=n.id==='hub'?58:(lines.length>1?70:H),
      titleY=lines.length>1?20:26,
      title=lines.map((ln,i)=>`<tspan x="${w/2}" dy="${i?15:0}">${esc(ln)}</tspan>`).join('');
    const meta = n.meta?`<text class="meta" x="${w/2+4}" y="${lines.length>1?57:45}" text-anchor="middle">${esc(n.meta)}</text>`:'';
    const bid = n.id!=='hub'&&/^[a-f]\d?$/.test(n.id)||/^d\d+$/.test(n.id) ? `<text class="bid" x="14" y="13">${esc(n.id.toUpperCase())}</text>` : '';
    return `<g class="node ${n.kind}" data-id="${n.id}" transform="translate(${x},${y})" tabindex="0" role="button" aria-label="${esc(n.label)}">`
      + `<rect class="body" width="${w}" height="${h}" rx="12"></rect>`
      + `<rect class="bar" x="12" y="${h-4}" width="${w-24}" height="3" rx="1.5"></rect>`
      + `<text class="title" x="${w/2}" y="${titleY}" text-anchor="middle">${title}</text>${meta}${bid}</g>`;
  }
  function center(id){
    if(groupBoxes[id]){ const [gx,gy,gw]=groupBoxes[id]; return [gx+gw/2,gy+34]; }
    const [x,y]=pos[id], w=id==='hub'?248:W, n=byId[id],
      h=id==='hub'?58:(wrap(n?.label||'').length>1?70:H);
    return [x+w/2,y+h/2];
  }
  function edgePath(e){
    const [x1,y1]=center(e.from),[x2,y2]=center(e.to);
    const my=Math.abs(y2-y1)>160 ? .5 : .5;
    const mx=(x1+x2)/2, yy1=y1+(y2-y1)*my*.4, yy2=y2-(y2-y1)*my*.4;
    return `M ${x1} ${y1} C ${mx} ${yy1}, ${mx} ${yy2}, ${x2} ${y2}`;
  }
  function render(){
    const groups=Object.entries(groupBoxes).map(([id,[x,y,w,h]])=>
      `<g class="group-wrap"><rect class="group" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"></rect>`
      + `<text class="group-title" x="${x+18}" y="${y+27}">${esc(byId[id].label)}</text>`
      + `<text class="group-count" x="${x+18}" y="${y+43}">${boxCount(id)} telas</text></g>`).join('');
    world.innerHTML=groups+edges.map(e=>`<path class="edge ${e.type==='future'?'future':''}" data-from="${e.from}" data-to="${e.to}" d="${edgePath(e)}"></path>`).join('')
      +nodes.filter(n=>n.kind!=='group'&&n.id!=='hub').map(card).join('')+card(byId.hub);
    updateVisibility(); renderMini();
  }

  let scale=1, tx=0, ty=0, selected=null;
  function apply(){
    world.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);
    document.getElementById('zoom').textContent=Math.round(scale*100)+'%';
    const r=workspace.getBoundingClientRect(), mini=document.getElementById('minimap');
    let v=document.getElementById('mini-view');
    if(mini&&!v){ v=document.createElementNS('http://www.w3.org/2000/svg','rect'); v.id='mini-view'; mini.appendChild(v); }
    if(v){ v.setAttribute('x',-tx/scale); v.setAttribute('y',-ty/scale); v.setAttribute('width',r.width/scale); v.setAttribute('height',r.height/scale); v.setAttribute('rx',12); }
  }
  function fit(){
    const r=workspace.getBoundingClientRect();
    scale=Math.min(r.width/VB_W, r.height/VB_H)*.96;
    tx=(r.width-VB_W*scale)/2; ty=(r.height-VB_H*scale)/2; apply();
  }
  function zoomAt(next,cx,cy){
    const old=scale; scale=Math.max(.28,Math.min(2.4,next));
    tx=cx-(cx-tx)*(scale/old); ty=cy-(cy-ty)*(scale/old); apply();
  }
  function centerOn(id, target=1){
    const [cx,cy]=center(id), r=workspace.getBoundingClientRect();
    scale=Math.max(.7,Math.min(1.4,target));
    tx=r.width/2-cx*scale; ty=r.height/2-cy*scale-40; apply();
  }
  const KIND={global:'Global',mvp:'MVP',proposed:'Proposta',future:'MVP+1',root:'Raiz'};
  function connected(id){
    const s=new Set([id]);
    edges.forEach(e=>{ if(e.from===id)s.add(e.to); if(e.to===id)s.add(e.from); });
    return s;
  }
  function select(id, opts={}){
    selected=id||null;
    document.querySelectorAll('.node').forEach(x=>x.classList.toggle('selected',x.dataset.id===id));
    const keep=id?connected(id):null;
    document.querySelectorAll('.node').forEach(x=>x.classList.toggle('dim',!!keep&&!keep.has(x.dataset.id)));
    document.querySelectorAll('.edge').forEach(p=>{
      const on=keep&&(keep.has(p.dataset.from)&&keep.has(p.dataset.to))&&(p.dataset.from===id||p.dataset.to===id);
      p.classList.toggle('lit',!!on); p.classList.toggle('dim',!!keep&&!on);
    });
    const n=byId[id];
    if(!n||n.kind==='group'){ if(!id) document.getElementById('inspector').innerHTML=`<div class="empty">Selecione uma tela para ver ID, rota, escopo e conexões.<br><br><span class="kbd">clique</span> seleciona · <span class="kbd">clique duplo</span> aproxima · <span class="kbd">esc</span> limpa</div>`; return; }
    const inbound=edges.filter(e=>e.to===id).map(e=>e.from), outbound=edges.filter(e=>e.from===id).map(e=>e.to);
    const chip=i=>`<button class="chip" type="button" data-go="${i}">${esc(byId[i]?.label||i)}</button>`;
    document.getElementById('inspector').innerHTML=`<span class="tag">${KIND[n.kind]||n.kind}</span><span class="tag">${esc(n.id.toUpperCase())}</span><h2>${esc(n.label)}</h2>`
      +(n.meta?`<p><strong>Rota / referência</strong><br>${esc(n.meta)}</p>`:`<p>Sem rota vinculada — tela de fluxo.</p>`)
      +`<p><strong>Entradas (${inbound.length})</strong><br>${inbound.length?inbound.map(chip).join(''):'—'}</p>`
      +`<p><strong>Saídas (${outbound.length})</strong><br>${outbound.length?outbound.map(chip).join(''):'—'}</p>`
      +`<div class="row"><button type="button" data-center="${id}">Centralizar</button><button type="button" data-clear="1">Limpar</button></div>`;
    if(opts.focus) centerOn(id);
  }

  function updateVisibility(){
    const q=norm(searchEl.value.trim()), f=filterEl.value;
    let hits=0, total=0;
    document.querySelectorAll('.node').forEach(el=>{
      const n=byId[el.dataset.id]; if(!n||n.id==='hub')return; total++;
      const hay=norm(n.label+' '+n.id+' '+n.meta);
      const okT=!q||hay.includes(q), okF=f==='all'||n.kind===f, ok=okT&&okF;
      el.classList.toggle('hidden',!ok); el.classList.toggle('match',!!q&&ok);
      if(ok&&q)hits++;
    });
    document.querySelectorAll('.edge').forEach(el=>{
      const from=document.querySelector(`.node[data-id="${el.dataset.from}"]`),to=document.querySelector(`.node[data-id="${el.dataset.to}"]`);
      el.classList.toggle('hidden',!!(from?.classList.contains('hidden')||to?.classList.contains('hidden')));
    });
    countEl.textContent=q?`${hits} resultado${hits===1?'':'s'}`:(f==='all'?'':`${document.querySelectorAll('.node:not(.hidden)').length} visíveis`);
    clearBtn.classList.toggle('on',!!searchEl.value);
    document.querySelectorAll('.hud button').forEach(b=>b.setAttribute('aria-pressed',String(filterEl.value===b.dataset.layer)));
  }

  searchEl.addEventListener('input',updateVisibility);
  searchEl.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ const m=document.querySelector('.node.match'); if(m){ select(m.dataset.id,{focus:true}); m.focus(); } }
    if(e.key==='Escape'){ searchEl.value=''; updateVisibility(); select(null); }
  });
  clearBtn.addEventListener('click',()=>{ searchEl.value=''; updateVisibility(); searchEl.focus(); });
  filterEl.addEventListener('change',updateVisibility);
  document.querySelectorAll('.hud button').forEach(b=>b.addEventListener('click',()=>{
    filterEl.value = filterEl.value===b.dataset.layer ? 'all' : b.dataset.layer; updateVisibility();
  }));
  document.getElementById('fit').addEventListener('click',fit);
  document.getElementById('reset').addEventListener('click',()=>{
    searchEl.value=''; filterEl.value='all'; select(null);
    document.querySelectorAll('.node').forEach(x=>x.classList.remove('match','dim'));
    document.querySelectorAll('.edge').forEach(x=>x.classList.remove('lit','dim'));
    updateVisibility(); fit();
  });
  document.getElementById('zin').addEventListener('click',()=>{ const r=workspace.getBoundingClientRect(); zoomAt(scale*1.2,r.width/2,r.height/2); });
  document.getElementById('zout').addEventListener('click',()=>{ const r=workspace.getBoundingClientRect(); zoomAt(scale/1.2,r.width/2,r.height/2); });

  let dragging=false,last=[0,0],moved=0;
  canvas.addEventListener('pointerdown',e=>{dragging=true;moved=0;last=[e.clientX,e.clientY];canvas.classList.add('dragging');canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-last[0],dy=e.clientY-last[1];moved+=Math.abs(dx)+Math.abs(dy);tx+=dx;ty+=dy;last=[e.clientX,e.clientY];apply();});
  canvas.addEventListener('pointerup',()=>{dragging=false;canvas.classList.remove('dragging');});
  canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoomAt(scale*(e.deltaY<0?1.1:.9),e.clientX-r.left,e.clientY-r.top);},{passive:false});
  world.addEventListener('click',e=>{
    if(moved>6)return;
    const go=e.target.closest('[data-go]'); if(go){ select(go.dataset.go,{focus:true}); return; }
    if(e.target.closest('[data-center]')){ centerOn(selected); return; }
    if(e.target.closest('[data-clear]')){ select(null); return; }
    const n=e.target.closest('.node'); if(n)select(n.dataset.id);
  });
  world.addEventListener('dblclick',e=>{ const n=e.target.closest('.node'); if(n){ select(n.dataset.id); centerOn(n.dataset.id,1.25); } });
  world.addEventListener('keydown',e=>{
    const n=e.target.closest('.node'); if(!n)return;
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); select(n.dataset.id); }
    if(e.key==='Escape')select(null);
  });
  document.addEventListener('keydown',e=>{
    if(e.target.matches('input,select,textarea'))return;
    if(e.key==='+'||e.key==='='){ const r=workspace.getBoundingClientRect(); zoomAt(scale*1.15,r.width/2,r.height/2); }
    if(e.key==='-'){ const r=workspace.getBoundingClientRect(); zoomAt(scale/1.15,r.width/2,r.height/2); }
    if(e.key==='0')fit(); if(e.key==='Escape')select(null);
  });

  function renderMini(){
    const mini=document.getElementById('minimap');
    mini.setAttribute('viewBox',`0 0 ${VB_W} ${VB_H}`);
    mini.innerHTML=nodes.filter(n=>n.kind!=='group').map(n=>{
      const [x,y]=pos[n.id],h=n.id==='hub'?58:(wrap(n.label).length>1?70:H);
      return `<rect x="${x}" y="${y}" width="${n.id==='hub'?248:W}" height="${h}" rx="4"></rect>`;
    }).join('')+'<rect id="mini-view" rx="12"></rect>';
    apply();
  }
  render(); requestAnimationFrame(fit);
  let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(fit,120); });
</script>
</body>
</html>
