    const head=document.createElement('div'); head.className='node-header'; head.innerHTML='📄 '+n.file.split('/').pop();
    head.title=n.file;
    const body=document.createElement('div'); body.className='node-body'; body.style.fontSize='11px'; body.style.color='var(--muted)';
    body.innerHTML = '<div style="font-family:ui-monospace,monospace; word-break:break-all">'+n.file+'</div><div style="margin-top:6px; font-size:11px; color:var(--muted)">Clique para copiar caminho</div>';
    el.appendChild(head); el.appendChild(body);
    el.addEventListener('click',()=>{ navigator.clipboard.writeText(n.file).catch(()=>{}); head.textContent='✓ Copiado: '+n.file.split('/').pop(); setTimeout(()=> head.textContent='📄 '+n.file.split('/').pop(), 1200); });
  } else {
    const body=document.createElement('div'); body.className='node-body'; body.innerHTML=mdToHtml(n.text||'');
    el.appendChild(body);
  }
  canvas.appendChild(el);
});

// edges as SVG paths with arrow
const NS='http://www.w3.org/2000/svg';
const defs=document.createElementNS(NS,'defs');
const marker=document.createElementNS(NS,'marker'); marker.setAttribute('id','arrow'); marker.setAttribute('viewBox','0 0 10 10'); marker.setAttribute('refX','9'); marker.setAttribute('refY','5'); marker.setAttribute('markerWidth','8'); marker.setAttribute('markerHeight','8'); marker.setAttribute('orient','auto');
const pathM=document.createElementNS(NS,'path'); pathM.setAttribute('d','M 0 0 L 10 5 L 0 10 z'); pathM.setAttribute('fill','#94a3b8'); marker.appendChild(pathM); defs.appendChild(marker); svg.appendChild(defs);

function anchorPos(node, side){
  const x=node.x+offX, y=node.y+offY, w=node.width, h=node.height;
  if(side==='left') return [x, y+h/2];
  if(side==='right') return [x+w, y+h/2];
  if(side==='top') return [x+w/2, y];
  if(side==='bottom') return [x+w/2, y+h];
  return [x+w/2, y+h/2];
}
const edgeColor={ "1":"#ef4444", "2":"#f97316", "3":"#eab308" };
raw.edges.forEach(e=>{
  const a=nodesById[e.fromNode], b=nodesById[e.toNode];
  if(!a||!b) return;
  const [x1,y1]=anchorPos(a.n, e.fromSide);
  const [x2,y2]=anchorPos(b.n, e.toSide);
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const dx=x2-x1, dy=y2-y1;
  // gentle curve
  const cx1=x1+dx*0.35, cy1=y1;
  const cx2=x2-dx*0.35, cy2=y2;
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d',`M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`);
  p.setAttribute('fill','none'); p.setAttribute('stroke', edgeColor[e.color]||'#94a3b8'); p.setAttribute('stroke-width','1.6'); p.setAttribute('marker-end','url(#arrow)'); p.setAttribute('opacity','0.9');
  if(e.color==='1') p.setAttribute('stroke-dasharray','6 4');
  svg.appendChild(p);
  if(e.label){
    const lab=document.createElement('div'); lab.className='edge-label'; lab.textContent=e.label;
    if(e.color) lab.style.borderColor=edgeColor[e.color];
    lab.style.left=mx+'px'; lab.style.top=my+'px';
    canvas.appendChild(lab);
  }
});

// pan/zoom
const viewport=document.getElementById('viewport');
let scale=0.22, tx=0, ty=0, isDrag=false, sx=0, sy=0, stx=0, sty=0;
function apply(){ canvas.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; }
function fitView(){
  const vw=viewport.clientWidth, vh=viewport.clientHeight;
  const sx = Math.min(vw/W, vh/H)*0.92;
  scale = Math.max(0.12, Math.min(0.9, sx));
  tx = (vw - W*scale)/2; ty = (vh - H*scale)/2;
  apply();
}
function resetView(){ scale=0.32; tx=20; ty=10; apply(); }
viewport.addEventListener('mousedown', e=>{ isDrag=true; sx=e.clientX; sy=e.clientY; stx=tx; sty=ty; });
window.addEventListener('mouseup', ()=> isDrag=false);
window.addEventListener('mousemove', e=>{ if(!isDrag) return; tx=stx+(e.clientX-sx); ty=sty+(e.clientY-sy); apply(); });
viewport.addEventListener('wheel', e=>{ e.preventDefault(); const d = e.deltaY>0 ? 0.92 : 1.08; const ns=Math.max(0.08, Math.min(2.5, scale*d)); const rect=viewport.getBoundingClientRect(); const mx=e.clientX-rect.left, my=e.clientY-rect.top; const wx=(mx-tx)/scale, wy=(my-ty)/scale; scale=ns; tx=mx-wx*scale; ty=my-wy*scale; apply(); }, {passive:false});
let pinch=0;
viewport.addEventListener('touchstart', e=>{ if(e.touches.length===1){ isDrag=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; stx=tx; sty=ty; } if(e.touches.length===2){ pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);} },{passive:false});
viewport.addEventListener('touchmove', e=>{
  if(e.touches.length===2){ e.preventDefault(); const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); const ns=Math.max(0.08, Math.min(2.5, scale*(d/(pinch||d)))); scale=ns; pinch=d; apply(); }
  else if(e.touches.length===1 && isDrag){ tx=stx+(e.touches[0].clientX-sx); ty=sty+(e.touches[0].clientY-sy); apply(); }
},{passive:false});
window.addEventListener('touchend', ()=>{ isDrag=false; });

// theme
function applyTheme(t){ document.documentElement.classList.toggle('dark', t==='dark'); const b=document.getElementById('themeBtn'); if(b) b.textContent = t==='dark' ? '☀️ Claro' : '🌙 Escuro'; try{ localStorage.setItem('hub-canvas-theme', t);}catch(e){} }
function toggleTheme(){ applyTheme(document.documentElement.classList.contains('dark')?'light':'dark'); }
(function(){ let s=null; try{ s=localStorage.getItem('hub-canvas-theme'); }catch(e){} const dark=window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; applyTheme(s || (dark?'dark':'light')); })();
window.fitView=fitView; window.resetView=resetView; window.toggleTheme=toggleTheme;
fitView();
</script>
